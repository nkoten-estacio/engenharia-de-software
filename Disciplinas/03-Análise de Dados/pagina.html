      <script type="text/babel" data-type="module">
         import React, { useState, useEffect, useRef } from "react";
         import { createRoot } from "react-dom/client";


         function DataAnalyzer() {
  // Estado para armazenar a entrada de dados do usuário
  const [dataInput, setDataInput] = useState('');
  // Estado para armazenar os resultados dos cálculos estatísticos
  const [results, setResults] = useState(null);
  // Estado para armazenar mensagens de erro
  const [error, setError] = useState('');
  // Ref para o elemento DOM onde o gráfico Plotly será renderizado
  const chartRef = useRef(null);

  // useEffect para renderizar/atualizar o gráfico Plotly sempre que 'results' muda
  useEffect(() => {
    // Só tenta renderizar o gráfico se houver resultados e a ref do chart estiver disponível
    if (results && chartRef.current) {
      // Cria o 'trace' para o boxplot
      const trace = {
        y: parseDataInput(), // Os dados brutos para o eixo Y do boxplot
        type: 'box',        // Tipo de gráfico: boxplot
        name: 'Distribuição dos Dados', // Nome da série no gráfico
        boxpoints: 'all',   // Mostrar todos os pontos de dados no boxplot
        jitter: 0.3,        // Adicionar um pouco de jitter para evitar sobreposição dos pontos
        pointpos: -1.8      // Posição dos pontos em relação à caixa
      };

      // Define o layout do gráfico
      const layout = {
        title: 'Boxplot dos Dados', // Título do gráfico
        yaxis: {
          title: 'Valores' // Título do eixo Y
        }
      };

      // Cria ou atualiza o gráfico Plotly no elemento referenciado
      Plotly.newPlot(chartRef.current, [trace], layout);
    }
  }, [results]); // O efeito é re-executado quando 'results' muda

  // Função auxiliar para parsear a string de entrada em um array de números
  const parseDataInput = () => {
    return dataInput
      .split(',') // Divide a string por vírgulas
      .map(s => s.trim()) // Remove espaços em branco de cada parte
      .filter(s => s !== '') // Remove qualquer string vazia
      .map(Number) // Converte cada parte para um número
      .filter(num => !isNaN(num)); // Remove valores que não puderam ser convertidos para número
  };

  // Função principal para analisar os dados e calcular as estatísticas
  const analyzeData = () => {
    setError('');       // Limpa mensagens de erro anteriores
    setResults(null);   // Limpa resultados anteriores

    const numbers = parseDataInput(); // Pega os números parseados

    // Validação básica: verifica se há números e se são válidos
    if (numbers.length === 0) {
      setError('Por favor, insira dados numéricos válidos separados por vírgulas.');
      return;
    }

    // Cria uma cópia dos números e os ordena para cálculos como mediana e amplitude
    const sortedNumbers = [...numbers].sort((a, b) => a - b);

    try {
      // Realiza os cálculos estatísticos usando math.js
      const calculatedMean = math.mean(sortedNumbers).toFixed(2);
      const calculatedMedian = math.median(sortedNumbers).toFixed(2);
      const calculatedMode = math.mode(sortedNumbers); // Pode retornar um array
      const calculatedMax = math.max(sortedNumbers).toFixed(2);
      const calculatedMin = math.min(sortedNumbers).toFixed(2);
      const calculatedAmplitude = (calculatedMax - calculatedMin).toFixed(2);
      const calculatedVariance = math.variance(sortedNumbers).toFixed(2); // Variância amostral por padrão
      const calculatedStdDev = math.std(sortedNumbers).toFixed(2);       // Desvio padrão amostral por padrão

      // Define os resultados no estado
      setResults({
        mean: calculatedMean,
        median: calculatedMedian,
        mode: calculatedMode.length > 0 ? calculatedMode.join(', ') : 'N/A', // Formata a moda
        amplitude: calculatedAmplitude,
        variance: calculatedVariance,
        stdDev: calculatedStdDev,
        data: numbers // Guarda os dados brutos para o boxplot no useEffect
      });

    } catch (e) {
      // Captura e exibe erros durante o cálculo
      setError('Ocorreu um erro ao calcular as estatísticas. Verifique seus dados.');
      console.error(e);
    }
  };

  // JSX: Estrutura da interface do usuário
  return (
    <div className="data-analyzer-container">
      <h1>Analisador de Dados Quantitativos</h1>
      <p>Insira seus números separados por vírgulas (ex: 3, 5, 8, 9, 10, 5, 5, 9, 4, 7)</p>

      {/* Campo de texto para entrada de dados */}
      <textarea
        className="data-input"
        value={dataInput}
        onChange={(e) => setDataInput(e.target.value)}
        placeholder="Digite seus dados aqui..."
        rows="5"
        cols="50"
      />

      {/* Botão para iniciar a análise */}
      <button onClick={analyzeData} className="analyze-button">
        Analisar Dados
      </button>

      {/* Exibe mensagem de erro se houver */}
      {error && <p className="error-message">{error}</p>}

      {/* Condicionalmente exibe os resultados e o gráfico se 'results' não for nulo */}
      {results && (
        <div className="results-container">
          <h2>Resultados da Análise:</h2>
          <p><strong>Média:</strong> {results.mean}</p>
          <p><strong>Mediana:</strong> {results.median}</p>
          <p><strong>Moda:</strong> {results.mode}</p>
          <p><strong>Amplitude:</strong> {results.amplitude}</p>
          <p><strong>Variância:</strong> {results.variance}</p>
          <p><strong>Desvio Padrão:</strong> {results.stdDev}</p>

          {/* Div onde o gráfico Plotly será renderizado */}
          <div ref={chartRef} className="boxplot-container">
            {/* O gráfico Plotly será inserido aqui pelo useEffect */}
          </div>
        </div>
      )}
    </div>
  );
}
